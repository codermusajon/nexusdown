<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Box -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Download Arrow & Tray -->
  <g filter="url(#glow)">
    <!-- Tray -->
    <path d="M16 44 h32 a4 4 0 0 1 4 4 v0 a4 4 0 0 1 -4 4 h-32 a4 4 0 0 1 -4 -4 v0 a4 4 0 0 1 4 -4 Z" fill="url(#iconGrad)" opacity="0.3"/>
    <path d="M18 46 h28" stroke="url(#iconGrad)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Arrow -->
    <path d="M32 14 v22" stroke="url(#iconGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M22 27 l10 10 l10 -10" stroke="url(#iconGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
